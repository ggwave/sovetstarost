<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151d33">
<title>Совет старост</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--ink:#172033;--muted:#6c768b;--line:#e4e8f1;--blue:#425ee8;--blue2:#edf0ff;--green:#15835d;--amber:#a8640a;--red:#c43f52;--shadow:0 8px 28px #23345c0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:650}
button.secondary{background:#eef1f8;color:#29334a}button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}button.danger{background:#fff0f1;color:var(--red)}button.small{padding:6px 9px;font-size:12px;border-radius:8px}button:disabled{opacity:.5;cursor:not-allowed}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#151d33,#273354 50%,#3a4a7a)}
.login-card{background:#fff;border-radius:20px;padding:32px 28px;width:min(400px,100%);box-shadow:0 24px 80px #0005}
.login-card .logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(145deg,#7185ff,#4058d9);display:grid;place-items:center;color:#fff;font-size:24px;margin:0 auto 16px}
.login-card h1{margin:0 0 6px;text-align:center;font-size:22px}.login-card .sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 20px}
.login-field{margin:12px 0}label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
input,select,textarea{border:1px solid #dfe4ef;background:#fff;border-radius:10px;padding:10px 12px;color:var(--ink);width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:#8a9aff;box-shadow:0 0 0 3px #7185ff20}
.login-err{color:var(--red);font-size:13px;margin:8px 0;display:none}
.app{display:none;grid-template-columns:240px 1fr;min-height:100vh}.app.show{display:grid}
.sidebar{background:#151d33;color:#fff;padding:20px 12px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}.brand .logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,#7185ff,#4058d9);display:grid;place-items:center;font-size:18px}
.brand strong{display:block;font-size:14px}.brand small{display:block;color:#aab4d0;font-size:11px}
.navlabel{color:#7885a8;text-transform:uppercase;letter-spacing:.1em;font-size:9px;padding:8px 10px 4px}
.nav{display:grid;gap:2px}.nav button{display:block;text-align:left;background:transparent;color:#b9c3dd;padding:9px 10px;font-weight:550;font-size:13px;border-radius:8px}
.nav button.active,.nav button:hover{background:#273354;color:#fff}
.sidebar-foot{margin-top:auto;padding:8px}.sidebar-foot button{width:100%;margin-top:6px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#ffffffee;border-bottom:1px solid var(--line);gap:10px;flex-shrink:0}
.topbar h1{font-size:16px;margin:0}.crumb{color:var(--muted);font-size:11px}
.badge-role,.fb-status{font-size:11px;font-weight:700;padding:4px 9px;border-radius:100px}
.badge-role{background:var(--blue2);color:#3349bc}.fb-status.on{background:#e4f7ef;color:var(--green)}.fb-status.off{background:#fff2d9;color:var(--amber)}.fb-status.err{background:#ffeaed;color:var(--red)}
.content{flex:1;overflow:auto;padding:20px 22px 40px;max-width:1100px;width:100%;margin:0 auto}
.page{display:none}.page.active{display:block}
.welcome{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.welcome h2{font-size:22px;margin:0 0 4px}.welcome p{margin:0;color:var(--muted);font-size:13px}
.welcome-actions{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat,.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.stat{padding:14px}.stat-top{color:var(--muted);font-size:11px}.stat-num{font-size:24px;font-weight:780;margin:6px 0 0}
.panel{padding:16px;margin-bottom:14px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.panel-head h3{margin:0;font-size:15px}
.pill{display:inline-flex;border-radius:100px;padding:3px 8px;font-size:11px;font-weight:700;background:#eef1f8;color:#5d6780}
.pill.green{background:#e4f7ef;color:var(--green)}.pill.amber{background:#fff2d9;color:var(--amber)}.pill.red{background:#ffeaed;color:var(--red)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{max-width:220px}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:480px}
.table th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:700;background:#fafbfe}
.table td,.table th{padding:10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
.table .maincell{font-weight:700}.empty{padding:28px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);margin-bottom:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{padding:14px}.card h4{margin:6px 0 4px;font-size:15px}.card p{color:var(--muted);font-size:13px;margin:0}
.card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.poll{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:#fff}
.poll h4{margin:0 0 4px}.poll .meta{font-size:12px;color:var(--muted);margin-bottom:8px}
.option{display:flex;gap:10px;border:1px solid var(--line);padding:10px 12px;border-radius:10px;margin:6px 0;cursor:pointer;align-items:flex-start}
.option:hover{background:#f8f9ff;border-color:#aab5ff}.option input{width:auto;margin-top:3px;accent-color:var(--blue)}
.option .opt-text{font-weight:600;display:block}.option .opt-desc{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.option .opt-link{font-size:12px;color:var(--blue)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid .full{grid-column:1/-1}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.notice{background:#f0f3ff;border:1px solid #dfe5ff;color:#394b9c;padding:11px 13px;border-radius:11px;font-size:12px;margin-bottom:12px}
.notice strong{display:block;margin-bottom:2px}.muted{color:var(--muted)}
.badge-campus{display:inline-flex;background:#e8f5e9;color:#2e7d32;font-size:11px;font-weight:700;padding:2px 7px;border-radius:100px}
.bar-chart{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.bar-label{font-size:13px;font-weight:600}.bar-desc{font-size:11px;color:var(--muted)}
.bar-track{height:16px;background:#edf0f6;border-radius:8px;overflow:hidden}
.bar-fill{height:100%;border-radius:8px;min-width:2px;transition:width .35s}.bar-pct{font-size:12px;color:var(--muted)}
.meeting-row{display:flex;gap:12px}.datebox{width:46px;height:48px;border-radius:11px;background:#f1f3ff;text-align:center;flex-shrink:0;padding-top:4px;color:#465be0}
.datebox b{font-size:17px;display:block;line-height:1.1}.datebox span{font-size:9px;text-transform:uppercase;font-weight:700}
.block-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 4px}
.block-body{font-size:13px;white-space:pre-wrap}
.opt-row,.lesson-row{border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0;background:#fafbfe}
.lesson-row{display:grid;grid-template-columns:70px 1fr 90px auto;gap:8px;align-items:end}
.detail-back{margin-bottom:12px}.detail-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.detail-card h2{margin:0 0 6px;font-size:20px}.detail-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.quorum{height:8px;background:#edf0f6;border-radius:6px;overflow:hidden;margin:8px 0}.quorum span{display:block;height:100%;background:var(--green);border-radius:6px}
.ann-item{border-bottom:1px solid var(--line);padding:12px 0}.ann-item:last-child{border-bottom:0}
.ann-item h4{margin:0 0 4px}.slide-view{background:#1a2240;color:#fff;border-radius:14px;padding:28px;min-height:200px;margin:12px 0}
.slide-view h3{margin:0 0 12px;font-size:22px}.slide-view p{margin:0;line-height:1.6;white-space:pre-wrap}
.live-banner{background:linear-gradient(90deg,#c43f52,#e85d4c);color:#fff;padding:10px 14px;border-radius:10px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.modal-backdrop{position:fixed;inset:0;background:#10182b80;display:none;align-items:center;justify-content:center;padding:14px;z-index:30}
.modal-backdrop.open{display:flex}.modal{background:#fff;width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:16px;padding:20px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modal-head h3{margin:0}
.toast{position:fixed;right:16px;bottom:16px;background:#17213a;color:#fff;padding:11px 14px;border-radius:11px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;z-index:40;max-width:90%}
.toast.show{opacity:1;transform:translateY(0)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:12px}
.cal-head{text-align:center;font-weight:700;color:var(--muted);padding:6px}
.cal-day{min-height:64px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px;font-size:11px}
.cal-day b{display:block;margin-bottom:2px}.cal-day .ev{background:var(--blue2);color:#3349bc;border-radius:4px;padding:1px 4px;margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.starost-wrap{max-width:640px;margin:0 auto}
.idea-score{font-size:18px;font-weight:800;color:var(--blue)}
@media(max-width:900px){.app.show{grid-template-columns:1fr}.sidebar{max-height:none;padding:8px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;font-size:12px;padding:8px}.navlabel{display:none}.form-grid{grid-template-columns:1fr}.lesson-row{grid-template-columns:1fr 1fr}.content{padding:14px}}

.meet-stage{border-radius:20px;overflow:hidden;margin-bottom:16px;position:relative}
.meet-stage.theme-night{background:linear-gradient(160deg,#0b1224 0%,#1a2750 50%,#243866 100%);color:#fff}
.meet-stage.theme-aurora{background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);color:#fff}
.meet-stage.theme-sunset{background:linear-gradient(135deg,#1a0a0a,#4a1520,#2d1b4e);color:#fff}
.meet-stage.theme-forest{background:linear-gradient(135deg,#0b1f14,#163526,#1a3a2a);color:#fff}
.meet-stage.theme-classic{background:linear-gradient(160deg,#f4f6fb,#e8ecf8);color:var(--ink);border:1px solid var(--line)}
.meet-hero{padding:28px 24px 20px;animation:meetIn .6s ease both}
@keyframes meetIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.meet-hero h2{margin:8px 0 6px;font-size:clamp(22px,4vw,32px);letter-spacing:-.02em}
.meet-hero .muted-hero{opacity:.75;font-size:14px}
.countdown{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 8px}
.cd-block{background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border-radius:14px;min-width:70px;padding:12px 10px;text-align:center;animation:cdPop .5s ease both}
.theme-classic .cd-block{background:#fff;box-shadow:var(--shadow);border:1px solid var(--line)}
.cd-block:nth-child(1){animation-delay:.05s}.cd-block:nth-child(2){animation-delay:.1s}
.cd-block:nth-child(3){animation-delay:.15s}.cd-block:nth-child(4){animation-delay:.2s}
@keyframes cdPop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.cd-num{font-size:clamp(22px,5vw,36px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.cd-lab{font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.65;margin-top:4px;font-weight:700}
.cd-live{display:inline-flex;align-items:center;gap:8px;background:#c43f52;color:#fff;font-weight:800;padding:10px 16px;border-radius:100px;animation:pulseLive 1.5s infinite}
@keyframes pulseLive{0%,100%{box-shadow:0 0 0 0 #c43f5288}50%{box-shadow:0 0 0 12px #c43f5200}}
.cd-done{opacity:.85;font-weight:700}
.meet-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 14px}
.meet-tabs button{background:rgba(255,255,255,.12);color:inherit;border:0;border-radius:100px;padding:8px 14px;font-size:12px;font-weight:650}
.theme-classic .meet-tabs button{background:#eef1f8;color:var(--ink)}
.meet-tabs button.active{background:#425ee8;color:#fff}
.meet-panel{padding:8px 20px 24px;animation:meetIn .45s ease both}
.theme-picker{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.theme-dot{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.theme-dot.active{border-color:#fff;box-shadow:0 0 0 2px #425ee8}
.theme-classic .theme-dot.active{border-color:#425ee8}

@media(max-width:900px){
  .app.show{grid-template-columns:1fr}
  .sidebar{max-height:none;padding:8px 8px 4px;position:sticky;top:0;z-index:15;background:#151d33}
  .nav{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:4px;padding-bottom:4px}
  .nav button{white-space:nowrap;font-size:12px;padding:8px 10px;flex-shrink:0}
  .navlabel,.sidebar-foot .hint{display:none}
  .sidebar-foot{padding:4px 0}
  .content{padding:12px 12px 80px}
  .welcome h2{font-size:18px}
  .form-grid{grid-template-columns:1fr}
  .lesson-row{grid-template-columns:1fr 1fr}
  .table{min-width:0;font-size:12px}
  .table td,.table th{padding:8px 6px}
  .cards{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr 1fr}
  .meet-tabs{overflow-x:auto;flex-wrap:nowrap}
  .meet-tabs button{flex-shrink:0}
  .topbar{padding:0 12px;height:52px}
  .topbar h1{font-size:14px}
  #liveControlPanel{width:calc(100vw - 24px)!important;right:12px!important;left:12px!important;bottom:12px!important}
  .diary-hero{padding:16px!important}
  .diary-student-card{padding:12px!important}
  .stat-num{font-size:20px}
}
.diary-hero{background:linear-gradient(135deg,#425ee8,#6b7ff4);color:#fff;border-radius:18px;padding:22px 20px;margin-bottom:14px;box-shadow:0 10px 28px #425ee833}
.diary-hero h2{margin:0 0 4px;font-size:22px;color:#fff}
.diary-hero p{margin:0;opacity:.85;font-size:13px}
.diary-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.diary-stat{background:rgba(255,255,255,.15);border-radius:12px;padding:10px;text-align:center}
.diary-stat b{display:block;font-size:20px}
.diary-stat span{font-size:10px;opacity:.85;text-transform:uppercase;letter-spacing:.04em}
.diary-section{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.diary-section h3{margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.diary-student-card{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fafbfe}
.diary-avatar{width:40px;height:40px;border-radius:12px;background:var(--blue2);color:#3349bc;display:grid;place-items:center;font-weight:800;font-size:14px;flex-shrink:0}
.diary-student-card select{flex:1;min-width:0;max-width:160px}
.ann-pending{border-left:3px solid var(--amber);background:#fffbf0}

.nav-fab,.nav-sheet-bg,.nav-sheet{display:none}
.desk-only{}
@media(max-width:900px){
  .desk-only{display:none!important}
  .sidebar{display:none!important}
  .app.show{grid-template-columns:1fr}
  .topbar{padding:0 14px;height:56px;background:#fff;border-bottom:1px solid var(--line)}
  .content{padding:14px 14px 100px;max-width:100%}
  .nav-fab{display:grid;place-items:center;position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));
    transform:translateX(-50%);width:60px;height:60px;border-radius:50%;border:0;z-index:50;
    background:linear-gradient(145deg,#5b6ff5,#425ee8);color:#fff;font-size:22px;font-weight:700;
    box-shadow:0 8px 28px #425ee866,0 2px 8px #0002;cursor:pointer;transition:transform .2s,box-shadow .2s}
  .nav-fab:active{transform:translateX(-50%) scale(.94)}
  .nav-fab.open{background:linear-gradient(145deg,#3d4a6b,#151d33);box-shadow:0 8px 24px #0004}
  .nav-sheet-bg{display:block;position:fixed;inset:0;background:#0b122499;z-index:55;opacity:0;pointer-events:none;transition:opacity .25s}
  .nav-sheet-bg.show{opacity:1;pointer-events:auto}
  .nav-sheet{display:block;position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;
    border-radius:22px 22px 0 0;padding:10px 16px calc(28px + env(safe-area-inset-bottom,0px));
    transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:78vh;overflow:auto;
    box-shadow:0 -8px 40px #0002}
  .nav-sheet.show{transform:translateY(0)}
  .nav-sheet-handle{width:40px;height:4px;border-radius:4px;background:#dfe3ee;margin:4px auto 12px}
  .nav-sheet-title{font-size:13px;font-weight:700;color:var(--muted);text-align:center;margin-bottom:14px;text-transform:uppercase;letter-spacing:.06em}
  .nav-sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .nav-sheet-item{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:16px;
    background:#f4f6fb;border:0;color:var(--ink);font-size:11px;font-weight:650;cursor:pointer;text-align:center;line-height:1.2}
  .nav-sheet-item:active{background:#e8ecf8}
  .nav-sheet-item.active{background:var(--blue2);color:#3349bc}
  .nav-sheet-ico{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:18px;background:#fff;box-shadow:0 2px 8px #0001}
  .welcome{margin-bottom:12px}
  .welcome h2{font-size:20px}
  .panel,.card,.poll,.diary-section{border-radius:16px}
  .starost-wrap{max-width:100%}
  .badge-role,.fb-status{font-size:10px;padding:3px 8px}
}
@media(min-width:901px){
  .nav-fab,.nav-sheet-bg,.nav-sheet{display:none!important}
}
</style>

<style id="mobile-nav-fix">
@media(max-width:900px){
  .sidebar{display:none!important}
  .app.show{display:block!important}
  .main{min-height:100vh}
  .nav-fab{display:grid!important}
}
</style>
</head>
<body>
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="logo">✦</div>
    <h1>Совет старост</h1>
    <p class="sub">Вход по аккаунту</p>
    <div class="login-field"><label>Логин</label><input type="text" id="loginUser" autocomplete="username"></div>
    <div class="login-field"><label>Пароль</label><input type="password" id="loginPass" autocomplete="current-password"></div>
    <div class="login-err" id="loginErr"></div>
    <button type="button" id="loginBtn" style="width:100%;margin-top:8px" onclick="doLogin()">Войти</button>

  </div>
</div>

<div class="app" id="appShell">
<aside class="sidebar">
  <div class="brand"><div class="logo">✦</div><div><strong>Совет старост</strong><small id="roleLabel">—</small></div></div>
  <div id="navChair" style="display:none">
    <div class="navlabel">Основное</div>
    <nav class="nav">
      <button class="active" data-page="dashboard">▦ Обзор</button>
      <button data-page="meetings">◷ Собрания</button>
      <button data-page="polls">◉ Голосования</button>
      <button data-page="announcements">📢 Объявления</button>
      <button data-page="events">📅 Календарь</button>
      <button data-page="duties">🧹 Дежурства</button>
    </nav>
    <div class="navlabel">Люди и учёба</div>
    <nav class="nav">
      <button data-page="contacts">👥 Старосты</button>
      <button data-page="problems">🔧 Проблемы</button>
      <button data-page="ideas">💡 Идеи</button>
      <button data-page="links">🔗 Ссылки</button>
      <button data-page="schedule">▤ Расписания</button>
      <button data-page="journals">📔 Журналы</button>
    </nav>
    <div class="navlabel">Система</div>

/* Charts */
function chartBars(p){
  const tot=pollTotal(p)||1,maxV=Math.max(...(p.options||[]).map(o=>o.votes||0),1);
  return `<div class="bar-chart">${(p.options||[]).map((o,i)=>{
    const pct=Math.round((o.votes||0)/tot*100),w=Math.round((o.votes||0)/maxV*100);
    return `<div><div class="bar-label">${esc(o.text)}</div>${o.desc?`<div class="bar-desc">${esc(o.desc)}</div>`:''}
      <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${COLORS[i%COLORS.length]}"></div></div>
      <div class="bar-pct">${pct}% · ${o.votes||0}</div></div>`;
  }).join('')}</div>`;
}
function quorumBar(p){
  if(!p.quorum) return '';
  const t=pollTotal(p), need=Number(p.quorum)||0, pct=need?Math.min(100,Math.round(t/need*100)):0;
  const ok=t>=need;
  return `<div style="margin:8px 0"><div class="muted" style="font-size:12px">Кворум: ${t} / ${need} ${ok?'✓ набран':'ещё нужно '+(need-t)}</div>
    <div class="quorum"><span style="width:${pct}%;background:${ok?'var(--green)':'var(--amber)'}"></span></div></div>`;
}

function startMeetingCountdown(m){
  if(window._cdTimer){clearInterval(window._cdTimer);window._cdTimer=null}
  const startMs=meetingStartMs(m);
  if(!startMs) return;
  window._cdTimer=setInterval(()=>{
    const box=document.getElementById('meetCountdown');
    if(!box){clearInterval(window._cdTimer);return}
    const left=startMs-Date.now();
    if(left<=0){
      clearInterval(window._cdTimer);
      renderMeetingDetail();
      return;
    }
    const cd=formatCountdown(left);
    const map={d:cd.d,h:String(cd.h).padStart(2,'0'),m:String(cd.m).padStart(2,'0'),s:String(cd.sec).padStart(2,'0')};
    box.querySelectorAll('.cd-num').forEach(el=>{
      const u=el.getAttribute('data-u');
      if(map[u]!==undefined && el.textContent!==String(map[u])){
        el.style.transform='scale(1.15)';
        el.textContent=map[u];
        setTimeout(()=>{el.style.transition='transform .2s';el.style.transform='scale(1)'},50);
      }
    });
  },250);
}

async function liveSlideNav(meetingId, delta){
  try{
    const snap=await firestore.collection('liveSessions').doc(meetingId).get();
    const cur=snap.exists?(snap.data().slideIndex||0):0;
    const m=db.meetings.find(x=>x.id===meetingId);
    const n=(m&&m.slides||[]).length||1;
    const next=(cur+delta+n)%n;
    await setLiveState(meetingId,{mode:'slides',slideIndex:next});
  }catch(e){toast(e.message)}
}

async function linkPollToMeeting(meetingId){
  const sel=document.getElementById('linkPollSelect');
  const pollId=sel&&sel.value;
  if(!pollId){toast('Выбери опрос');return}
  const m=db.meetings.find(x=>x.id===meetingId); if(!m)return;
  const ids=[...(m.pollIds||(m.pollId?[m.pollId]:[]))];
  if(ids.includes(pollId)){toast('Уже привязан');return}
  ids.push(pollId);
  try{
    await firestore.collection('meetings').doc(meetingId).set({pollIds:ids,updated:new Date().toISOString()},{merge:true});
    toast('Опрос привязан к собранию');
  }catch(e){toast(e.message)}
}
async function unlinkPollFromMeeting(meetingId, pollId){
  const m=db.meetings.find(x=>x.id===meetingId); if(!m)return;
  const ids=(m.pollIds||(m.pollId?[m.pollId]:[])).filter(id=>id!==pollId);
  try{
    await firestore.collection('meetings').doc(meetingId).set({pollIds:ids,pollId:null,updated:new Date().toISOString()},{merge:true});
    toast('Отвязано');
  }catch(e){toast(e.message)}
}

function renderSlide(slides,i){
  if(!slides.length) return '';
  const s=slides[i]||slides[0];
  return `<div class="slide-view"><div class="muted" style="color:#9ab;font-size:12px;margin-bottom:8px">Слайд ${i+1} / ${slides.length}</div><h3>${esc(s.title||'')}</h3><p>${esc(s.body||'')}</p></div>`;
}
function chgSlide(d,n){slideIdx=(slideIdx+d+n)%n;const box=document.getElementById('slideBox');if(box)box.innerHTML=renderSlide(window._slides,slideIdx)}
function startSlideShow(){
  const slides=window._slides||[]; if(!slides.length)return;
  const w=window.open('','_blank');
  if(!w){toast('Разреши всплывающие окна');return}
  let i=0;
  const draw=()=>{const s=slides[i];w.document.body.innerHTML=`<div style="font:20px/1.5 system-ui;padding:40px;background:#1a2240;color:#fff;min-height:100vh"><div style="opacity:.6;font-size:14px">${i+1}/${slides.length}</div><h1>${esc(s.title||'')}</h1><pre style="white-space:pre-wrap;font:18px/1.6 system-ui">${esc(s.body||'')}</pre><p style="opacity:.5;margin-top:40px">← → или клик</p></div>`};
  w.document.write('<title>Презентация</title><body></body>');
  draw();
  w.document.body.onclick=()=>{i=(i+1)%slides.length;draw()};
  w.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){i=(i+1)%slides.length;draw()} if(e.key==='ArrowLeft'){i=(i-1+slides.length)%slides.length;draw()}});
}
async function editMeetingMinutes(id){

}

}

<script>
const firebaseConfig=${cfg};
const pollId=${pollId};
const COLORS=${colors};
const meetStartStr=${meetStart};
const meetTitle=${meetTitle};
const deadlineStr=${deadline};
let lastStatus='', lastVotes='';
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('themeBar').onclick=function(e){
  const b=e.target.closest('button[data-t]'); if(!b)return;
  document.body.className='theme-'+b.getAttribute('data-t');
  document.querySelectorAll('#themeBar button').forEach(x=>x.classList.toggle('on',x===b));

function pad(n){return String(n).padStart(2,'0')}
function renderCd(targetMs, label){
  const box=document.getElementById('countdown');
  const lab=document.getElementById('cdLabel');
  if(!targetMs){box.innerHTML='';lab.textContent='';return}
  const left=targetMs-Date.now();
  lab.textContent=label||'';
  if(left<=0){
    box.innerHTML='<div class="cd" style="min-width:160px;background:#c43f52"><div class="n" style="font-size:18px">СЕЙЧАС</div><div class="l">идёт голосование</div></div>';
    return;
  }
  const s=Math.floor(left/1000);
  const d=Math.floor(s/86400), h=Math.floor((s%86400)/3600), m=Math.floor((s%3600)/60), sec=s%60;
  box.innerHTML=(d>0?'<div class="cd"><div class="n">'+d+'</div><div class="l">дней</div></div>':'')+
    '<div class="cd"><div class="n">'+pad(h)+'</div><div class="l">часов</div></div>'+
    '<div class="cd"><div class="n">'+pad(m)+'</div><div class="l">минут</div></div>'+
    '<div class="cd"><div class="n">'+pad(sec)+'</div><div class="l">секунд</div></div>';
}
function tickCd(){
  if(deadlineStr){
    const t=new Date(deadlineStr.length===10?deadlineStr+'T23:59:59':deadlineStr).getTime();
    if(!isNaN(t) && t>Date.now()){renderCd(t,'до окончания голосования');return}
  }
  if(meetStartStr){
    const t=new Date(meetStartStr).getTime();
    if(!isNaN(t)){renderCd(t, meetTitle?('до собрания «'+meetTitle+'»'):'до начала собрания');return}
  }
  document.getElementById('countdown').innerHTML='';
  document.getElementById('cdLabel').textContent='';
}
setInterval(tickCd, 250); tickCd();
try{
  if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db=firebase.firestore();
  db.collection('polls').doc(pollId).onSnapshot(snap=>{
    if(!snap.exists){document.getElementById('title').textContent='Опрос удалён';return}
    const p=snap.data();
    const opts=p.options||[];
    const tot=opts.reduce((n,o)=>n+(o.votes||0),0)||0;
    const maxV=Math.max.apply(null,opts.map(o=>o.votes||0).concat([1]));
    const votesKey=opts.map(o=>o.votes||0).join(',');
    document.getElementById('title').textContent=p.title||'Голосование';
    document.getElementById('sub').textContent=(p.description||'')+' · '+(p.status||'')+(p.anonymous===false?' · именное':' · анонимно');
    document.getElementById('total').textContent=tot;
    const q=Number(p.quorum)||0;
    const qb=document.getElementById('quorumBox');
    if(q>0){
      qb.style.display='block';
      const pct=Math.min(100,Math.round(tot/q*100));
      const ok=tot>=q;
      document.getElementById('quorumLab').textContent='Кворум: '+tot+' / '+q+(ok?' ✓ набран':' — ещё '+(q-tot));
      const fill=document.getElementById('quorumFill');
      fill.style.width=pct+'%';
      fill.style.background=ok?'#15835d':'#a8640a';
    } else qb.style.display='none';
    document.getElementById('board').innerHTML=opts.map((o,i)=>{
      const c=COLORS[i%COLORS.length];
      const grow=votesKey!==lastVotes?'transform:scale(1.08)':'';
      return '<div class="cell" style="border-color:'+c+'55;animation-delay:'+(i*0.05)+'s"><div class="n" style="color:'+c+';'+grow+'">'+(o.votes||0)+'</div><div class="l">'+esc(o.text)+'</div></div>';
    }).join('');
    document.getElementById('bars').innerHTML=opts.map((o,i)=>{
      const c=COLORS[i%COLORS.length];
      const votes=o.votes||0;
      const pct=tot?Math.round(votes/tot*100):0;
      const wdt=Math.round(votes/maxV*100);
      return '<div class="row" style="animation-delay:'+(i*0.06)+'s"><div><div class="name">'+esc(o.text)+'</div>'+
        (o.desc?'<div class="desc">'+esc(o.desc)+'</div>':'')+'</div>'+
        '<div class="track"><div class="fill" style="width:'+wdt+'%;background:'+c+'">'+(wdt>15?votes:'')+'</div></div>'+
        '<div class="pct">'+pct+'%</div></div>';
    }).join('');
    lastVotes=votesKey;
    if(p.status==='Закрыто'){
      if(!window._closedShown){
        window._closedShown=true;
        document.body.classList.add('is-closed');
        var liveTag=document.querySelector('.live-tag');
        if(liveTag) liveTag.innerHTML='<i></i> ЗАВЕРШЕНО';
        var sorted=opts.slice().sort(function(a,b){return (b.votes||0)-(a.votes||0)});
        var win=sorted[0];
        var wb=document.getElementById('winnerBox');
        if(win&&(win.votes||0)>0){
          wb.innerHTML='<div class="w-label">Победитель</div><div class="w-name">'+esc(win.text)+'</div><div style="color:var(--muted);margin-top:4px">'+(win.votes||0)+' · '+(tot?Math.round((win.votes||0)/tot*100):0)+'%</div>';
        } else wb.innerHTML='<div class="w-name">Нет голосов</div>';
        document.getElementById('closedTitle').textContent=p.title||'Итоги';
        document.getElementById('closedSub').textContent='Всего: '+tot+(q>0?' · кворум '+(tot>=q?'набран':'не набран'):'');
        var conf=document.getElementById('confetti'); conf.innerHTML='';
        var cols=COLORS.concat(['#fff','#ffd54f','#81c784']);
        for(var ci=0;ci<70;ci++){
          var el=document.createElement('i');
          el.style.left=(Math.random()*100)+'%';
          el.style.background=cols[ci%cols.length];
          el.style.animationDuration=(2+Math.random()*2.5)+'s';
          el.style.animationDelay=(Math.random()*0.9)+'s';
          el.style.width=(6+Math.random()*8)+'px';
          el.style.height=(8+Math.random()*10)+'px';
          conf.appendChild(el);
        }
        setTimeout(function(){document.getElementById('closedOverlay').classList.add('show')},180);
      }
    } else {
      window._closedShown=false;
      document.body.classList.remove('is-closed');
      document.getElementById('closedOverlay').classList.remove('show');

async function vote(e,id){
  e.preventDefault();
  if(!currentUser) return;
  const p=db.polls.find(x=>x.id===id); if(!p||p.status!=='Открыто')return;
  if(userHasVoted(p)){toast('Уже голосовали');return}
  const choices=[...new FormData(e.target).getAll('choice')].map(Number);
  if(!choices.length){toast('Выбери вариант');return}
  try{
    await firestore.runTransaction(async tx=>{
      const ref=firestore.collection('polls').doc(id);
      const snap=await tx.get(ref); if(!snap.exists) throw new Error('Не найден');
      const data=snap.data(); if(data.status!=='Открыто') throw new Error('Закрыто');
      const vids=data.voterIds||[]; if(vids.includes(currentUser.id)) throw new Error('Уже голосовали');
      const options=data.options.map((o,i)=>({...o,votes:(o.votes||0)+(choices.includes(i)?1:0)}));
      const upd={options,voterIds:[...vids,currentUser.id]};
      if(data.anonymous===false){upd.voterNames=[...(data.voterNames||[]), currentUser.name||currentUser.login]}
      tx.update(ref,upd);
    });
    toast('Голос учтён');
  }catch(err){toast(err.message)}
}

}

async function voteIdea(id,delta){
  if(!currentUser)return;
  try{
    await firestore.runTransaction(async tx=>{
      const ref=firestore.collection('ideas').doc(id);
      const snap=await tx.get(ref); if(!snap.exists) return;
      const data=snap.data(); const voters=data.voters||{};
      if(voters[currentUser.id]===delta) return;
      let score=data.score||0;
      if(voters[currentUser.id]) score-=voters[currentUser.id];
      score+=delta; voters[currentUser.id]=delta;
      tx.update(ref,{score,voters});
    });
  }catch(e){toast(e.message)}
}

async function editDiaryEntry(id){
  const d=(db.diary||[]).find(x=>x.id===id);
  if(!d){toast('Не найдено');return}
  if(d.type==='attendance'){
    const st=prompt('Статус: present / late / absent', d.status||'present');
    if(st===null)return;
    const v=st.trim().toLowerCase();
    if(!['present','late','absent'].includes(v)){toast('Нужно: present, late или absent');return}
    try{await firestore.collection('diary').doc(id).update({status:v,updated:new Date().toISOString()});toast('Обновлено')}
    catch(e){toast(e.message)}
    return;
  }
  const kind=prompt('Тип записи (Замечание, Опоздание, …)', d.kind||'');
  if(kind===null)return;
  const text=prompt('Текст', d.text||'');
  if(text===null)return;
  const date=prompt('Дата (ГГГГ-ММ-ДД)', d.date||'');
  if(date===null)return;
  const studentName=prompt('Ученик', d.studentName||'');
  if(studentName===null)return;

/* ===== Дневник класса (общий по классу) ===== */
function normKlass(k){return String(k||'').trim().toLowerCase().replace(/\s+/g,'')}
function myKlass(){return (currentUser&&currentUser.klass)||''}
function myClassList(){
  const k=normKlass(myKlass());
  if(!k) return db.classlists.find(c=>c.ownerId===currentUser.id)||null;
  return db.classlists.find(c=>normKlass(c.klass)===k) || db.classlists.find(c=>c.ownerId===currentUser.id) || null;
}
function myStudents(){
  const cl=myClassList();
  return (cl&&cl.students)?cl.students:[];
}
function classDiaryEntries(){
  const k=normKlass(myKlass());
  const cl=myClassList();
  return (db.diary||[]).filter(d=>{
    if(k && normKlass(d.klass)===k) return true;
    if(cl && d.classListId===cl.id) return true;
    if(!k && d.ownerId===currentUser.id) return true;
    return false;
  });
}
function initials(name){
  const p=String(name||'?').trim().split(/\s+/);
  return ((p[0]&&p[0][0]||'')+(p[1]&&p[1][0]||'')).toUpperCase()||'?';
}

async function ensureClassList(){
  const klass=myKlass();
  if(!klass){toast('Сначала укажи класс в аккаунте');return}
  if(myClassList()){toast('Список класса уже есть');renderDiaryPage();return}
  try{
    await firestore.collection('classlists').add({
      klass, klassKey:normKlass(klass), ownerId:currentUser.id, ownerName:currentUser.name,
      students:[], shared:true, updated:new Date().toISOString()
    });
    toast('Общий список класса создан');
  }catch(e){toast(e.message)}
}
async function removeStudent(sid){
  const cl=myClassList(); if(!cl)return;
  if(!confirm('Удалить ученика из общего списка класса?'))return;
  const students=(cl.students||[]).filter(s=>s.id!==sid);
  try{
    await firestore.collection('classlists').doc(cl.id).update({students,updated:new Date().toISOString()});
    toast('Удалён');
  }catch(e){toast(e.message)}

async function setAttendance(studentId, studentName, date, status){
  if(!fbEnabled){toast('Нужен Firebase');return}
  const cl=myClassList();

  try{
    const existing=classDiaryEntries().find(d=>d.date===date&&d.studentId===studentId&&d.type==='attendance');
    const payload={
      ownerId:currentUser.id, ownerName:currentUser.name, klass, klassKey:normKlass(klass),

    };

function translitRu(s){
  const map={а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'ts',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'};
  return String(s||'').toLowerCase().split('').map(c=>map[c]!==undefined?map[c]:c).join('');
}
function genLoginFromName(name){
  let t=translitRu(name).replace(/\s+/g,'_').replace(/[^a-z0-9_\\-]/g,'');
  t=t.replace(/_+/g,'_').replace(/^_|_$/g,'');
  if(!t) t='user';
  return t.slice(0,6) || 'user';
}
function genPassword6(){
  const chars='abcdefghjkmnpqrstuvwxyz23456789';
  let p='';
  for(let i=0;i<6;i++) p+=chars[Math.floor(Math.random()*chars.length)];
  return p;
}
function normalizeFio(s){
  return String(s||'').toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ').trim();
}
function findNickRow(name){
  const n=normalizeFio(name);
  if(!n) return null;
  // exact
  let row=NICK_TABLE.find(r=>normalizeFio(r.fio)===n);
  if(row) return row;
  // starts with / contains surname+name
  const parts=n.split(' ');
  row=NICK_TABLE.find(r=>{
    const f=normalizeFio(r.fio);
    if(f.startsWith(n)||n.startsWith(f)) return true;
    if(parts.length>=2){
      const s=parts[0], nm=parts[1];
      return f.includes(s)&&f.includes(nm);
    }
    return f.includes(n)||n.includes(f);
  });
  return row||null;
}
function autoGenAccount(force){
  const nameEl=document.getElementById('userNameInput');
  const loginEl=document.getElementById('userLoginInput');
  const passEl=document.getElementById('userPassInput');
  const klassEl=document.querySelector('#modalForm input[name="klass"]');
  const phoneEl=document.querySelector('#modalForm input[name="phone"]');
  const contactEl=document.querySelector('#modalForm input[name="contact"]');
  if(!nameEl||!loginEl||!passEl) return;
  const name=nameEl.value.trim();
  if(!name && !force) return;
  const row=findNickRow(name);
  if(row){
    if(force || !loginEl.dataset.manual){
      loginEl.value=row.nick || genLoginFromName(name);
    }
    if(klassEl && (force || !klassEl.value)) klassEl.value=row.klass||'';
    if(phoneEl && (force || !phoneEl.value)) phoneEl.value=row.phone||'';
    if(contactEl && (force || !contactEl.value)) contactEl.value=row.tg?('@'+row.nick):'';
  } else {
    if(force || !loginEl.dataset.manual){
      loginEl.value=genLoginFromName(name||'user');
    }
  }
  if(force || !passEl.value){
    passEl.value=genPassword6();
  }
}

async function submitModal(e){

  const f=new FormData(e.target), v=Object.fromEntries(f.entries());
  try{
    if(modalType==='poll'){
      const texts=f.getAll('opt_text').map(String), descs=f.getAll('opt_desc').map(String), links=f.getAll('opt_link').map(String);

      if(options.length<2){toast('Минимум 2 варианта');return}
      const poll={title:v.title,description:v.description||'',options,mode:v.mode==='multi'?'multi':'single',

          ids.push(pollRef.id);
          await firestore.collection('meetings').doc(mid).set({pollIds:ids,updated:new Date().toISOString()},{merge:true});
          toast('Опрос создан и привязан к собранию');
        }catch(e){toast('Опрос создан, привязка: '+e.message)}

      notifyNewPoll(poll.title);

      const login=v.login.trim().toLowerCase();
      if(!/^[a-z0-9_-]+$/i.test(login)){toast('Логин: латиница');return}
      const ex=await firestore.collection('users').where('login','==',login).limit(1).get();
      if(!ex.empty){toast('Логин занят');return}
      await firestore.collection('users').add({login,password:v.password,name:v.name,role:v.role==='chair'?'chair':'starost',
        klass:v.klass||'',phone:v.phone||'',contact:v.contact||'',active:true,created:new Date().toISOString()});
      closeModal(); toast('Аккаунт создан'); return;
    }
        if(modalType==='disciplineChair'){
      const owner=db.users.find(u=>u.id===v.ownerId);
      if(!owner){toast('Выбери старосту');return}
      await firestore.collection('diary').add({
        ownerId:owner.id, ownerName:owner.name, klass:owner.klass||'',
        type:'discipline', date:v.date, studentId:null,
        studentName:(v.studentName||'').trim()||'—',
        kind:v.kind||'Заметка', text:v.text||'',
        created:new Date().toISOString(), byChair:true
      });
      closeModal(); toast('Запись добавлена'); return;
    }
    if(modalType==='student'){
      let cl=myClassList();
      const klass=myKlass()||'Класс';
      if(!cl){
        const ref=await firestore.collection('classlists').add({
          ownerId:currentUser.id,ownerName:currentUser.name,klass,klassKey:normKlass(klass),
          students:[],shared:true,updated:new Date().toISOString()
        });
        cl={id:ref.id,students:[]};
      }
      const name=(v.name||'').trim();
      if(!name){toast('Укажи ФИО');return}
      const students=[...(cl.students||[]),{id:uid(),name}];
      await firestore.collection('classlists').doc(cl.id).update({students,updated:new Date().toISOString()});
      closeModal(); toast('Ученик в общем списке класса'); return;
    }
    if(modalType==='discipline'){
      const sid=v.studentId||'';
      const student=myStudents().find(s=>s.id===sid);
      const cl=myClassList();
      const klass=myKlass()||(cl&&cl.klass)||'';
      await firestore.collection('diary').add({
        ownerId:currentUser.id,ownerName:currentUser.name,klass,klassKey:normKlass(klass),
        classListId:cl?cl.id:null, type:'discipline',date:v.date,studentId:sid||null,
        studentName:student?student.name:(sid?'':'Общее'),
        kind:v.kind||'Заметка',text:v.text||'',created:new Date().toISOString()
      });
      closeModal(); toast('Запись в общем журнале'); return;
    }
    if(modalType==='schedule'){
      const nums=f.getAll('les_num'), subjs=f.getAll('les_subj'), rooms=f.getAll('les_room');
      const items=[]; for(let i=0;i<subjs.length;i++) if(String(subjs[i]).trim()) items.push({num:String(nums[i]||i+1),subject:String(subjs[i]).trim(),room:String(rooms[i]||'').trim()});
      if(!items.length){toast('Добавь уроки');return}
      items.sort((a,b)=>Number(a.num)-Number(b.num));
      db.schedules.push({id:uid(),klass:v.klass,day:v.day,items,lessons:items.map(x=>x.num+'. '+x.subject+(x.room?' — '+x.room:'')).join('; '),newCampus:!!f.get('newCampus')});
      saveLocal(); closeModal(); renderCurrent(); toast('Сохранено'); return;
    }
  }catch(err){console.error(err);toast(err.message)}
}

async function delDoc(col,id){
  if(!confirm('Удалить?'))return;
  try{await firestore.collection(col).doc(id).delete();toast('Удалено')}catch(e){toast(e.message)}
}

  const url=settings.telegramWebhook;
  if(!url) return;
  fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:`Новый опрос совета старост: ${title}`})}).catch(()=>{});

function buildNavSheet(){
  const grid=document.getElementById('navSheetGrid');
  if(!grid||!currentUser) return;
  const items=isChair()?chairMenuItems():starostMenuItems();
  const cur=window._page||'';
  grid.innerHTML=items.map(it=>`<button type="button" class="nav-sheet-item ${cur===it.page?'active':''}" onclick="navSheetGo('${it.page}')">
    <span class="nav-sheet-ico">${it.ico}</span>${it.label}</button>`).join('');
}
function toggleNavSheet(){
  const sheet=document.getElementById('navSheet');
  const bg=document.getElementById('navSheetBg');
  const fab=document.getElementById('navFab');
  if(!sheet) return;
  const open=!sheet.classList.contains('show');
  buildNavSheet();
  sheet.classList.toggle('show',open);
  bg.classList.toggle('show',open);
  fab.classList.toggle('open',open);
  fab.textContent=open?'✕':'☰';
}
function closeNavSheet(){
  document.getElementById('navSheet')?.classList.remove('show');
  document.getElementById('navSheetBg')?.classList.remove('show');
  const fab=document.getElementById('navFab');
  if(fab){fab.classList.remove('open');fab.textContent='☰'}
}
function navSheetGo(page){
  closeNavSheet();
  showPage(page);
}
